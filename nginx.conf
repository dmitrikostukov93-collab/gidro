# nginx.conf — шаблон для VPS-деплоя Мастерская Стен
# Замените masterskaya-sten.ru на финальный домен
# Замените /var/www/masterskaya-sten на реальный путь к файлам
# SSL-сертификат получите через: certbot --nginx -d masterskaya-sten.ru -d www.masterskaya-sten.ru

server {
    listen 80;
    server_name masterskaya-sten.ru www.masterskaya-sten.ru;

    # Redirect all HTTP to HTTPS
    return 301 https://masterskaya-sten.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.masterskaya-sten.ru;

    ssl_certificate     /etc/letsencrypt/live/masterskaya-sten.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masterskaya-sten.ru/privkey.pem;

    # Redirect www → non-www
    return 301 https://masterskaya-sten.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name masterskaya-sten.ru;

    ssl_certificate     /etc/letsencrypt/live/masterskaya-sten.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masterskaya-sten.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /var/www/masterskaya-sten;
    index index_real.html;

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Cache static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt and sitemap — short cache
    location ~* \.(txt|xml)$ {
        expires 1d;
    }

    # Form submission handler — proxy to Node.js if running as backend
    # Uncomment if using Node.js server instead of pure static:
    # location /api/ {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # Fallback for SPA-style navigation
    location / {
        try_files $uri $uri/ /index_real.html;
    }
}
