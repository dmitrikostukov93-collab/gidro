# nginx.conf — ДОН ГИДРО ДЕКОР
# SSL: certbot --nginx -d dgd61.ru -d www.dgd61.ru

# Rate limiting: не более 5 заявок с одного IP в минуту
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/m;

server {
    listen 80;
    server_name dgd61.ru www.dgd61.ru;
    return 301 https://dgd61.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.dgd61.ru;

    ssl_certificate     /etc/letsencrypt/live/dgd61.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dgd61.ru/privkey.pem;

    return 301 https://dgd61.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dgd61.ru;

    ssl_certificate     /etc/letsencrypt/live/dgd61.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dgd61.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /var/www/dgd61;
    index index_real.html;

    # Скрываем версию nginx
    server_tokens off;

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Статика: ^~ даёт приоритет над regex-блоками ниже
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Запрещаем прямой доступ к служебным файлам вне /assets/
    location ~* \.(json|env|sh|log|conf)$ {
        deny all;
    }
    # Блокируем watermark.js, server.js и т.п. из корня
    location ~* ^/[^/]+\.js$ {
        deny all;
    }

    # robots.txt и sitemap
    location ~* \.(txt|xml)$ {
        expires 1d;
    }

    # API — proxy к Node.js с rate limiting
    location /api/ {
        limit_req zone=api_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # HTML-страницы
    location / {
        try_files $uri $uri/ /index_real.html;
    }
}
