# nginx.conf — шаблон для VPS-деплоя ДОН ГИДРО ДЕКОР
# SSL-сертификат получите через: certbot --nginx -d dgd61.ru -d www.dgd61.ru

server {
    listen 80;
    server_name dgd61.ru www.dgd61.ru;

    # Redirect all HTTP to HTTPS
    return 301 https://dgd61.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.dgd61.ru;

    ssl_certificate     /etc/letsencrypt/live/dgd61.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dgd61.ru/privkey.pem;

    # Redirect www → non-www
    return 301 https://dgd61.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dgd61.ru;

    ssl_certificate     /etc/letsencrypt/live/dgd61.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dgd61.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /var/www/dgd61;
    index index_real.html;

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Cache static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt and sitemap — short cache
    location ~* \.(txt|xml)$ {
        expires 1d;
    }

    # Form submission handler — proxy to Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Fallback for SPA-style navigation
    location / {
        try_files $uri $uri/ /index_real.html;
    }
}
