<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — ДОН ГИДРО ДЕКОР</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<style>
:root{--bg:#1e2535;--bg-card:#262f42;--accent:#C0502A;--text:#edeae5;--text-dim:#9aa0b0;--border:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'PT Sans',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip;min-height:100vh}
a{color:inherit;text-decoration:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
.code{font-size:clamp(6rem,20vw,10rem);font-weight:700;line-height:1;color:var(--accent);opacity:.25;letter-spacing:-.04em;user-select:none}
.title{font-size:clamp(1.4rem,4vw,2rem);font-weight:600;margin-top:8px;margin-bottom:16px}
.sub{color:var(--text-dim);font-size:1rem;max-width:360px;margin:0 auto 40px}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:8px;font-size:.95rem;transition:opacity .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{border:1px solid var(--border);color:var(--text-dim)}
.btn:hover{opacity:.8}
.logo{font-size:.85rem;color:var(--text-dim);margin-top:60px;letter-spacing:.06em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="code">404</div>
  <h1 class="title">Страница не найдена</h1>
  <p class="sub">Возможно, она была удалена или вы ввели неверный адрес</p>
  <div class="links">
    <a href="/" class="btn btn-primary">← На главную</a>
    <a href="/galereya" class="btn btn-ghost">Галерея работ</a>
    <a href="/kontakty" class="btn btn-ghost">Контакты</a>
  </div>
  <div class="logo">ДОН ГИДРО ДЕКОР · Ростов-на-Дону</div>
</body>
</html>
